<!DOCTYPE html>
<!DOCTYPE html>
<html lang="id"><head><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Gudang Script</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="style.css" rel="stylesheet"/></head><body class="bg-slate-950 text-slate-100 font-['Plus_Jakarta_Sans'] min-h-screen flex flex-col" data-page="login"><div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 transition-all duration-300" id="auth-modal">
<div class="bg-slate-900 border border-slate-800 w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden">
<div class="absolute -top-12 -right-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-cyan-500/10 text-cyan-400 mb-4 text-2xl shadow-inner">
<i class="fa-solid fa-gamepad"></i>
</div>
<h1 class="text-2xl font-bold tracking-tight">Gudang Script</h1>
<p class="text-slate-400 text-sm mt-1">Silakan masuk atau daftar terlebih dahulu untuk melanjutkan</p>
</div>
<div class="flex rounded-xl bg-slate-950 p-1 mb-6 border border-slate-800/60">
<button class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all text-cyan-400 bg-slate-800 shadow-sm cursor-pointer" id="tab-login" onclick="switchAuthTab('login')">Masuk Akun</button>
<button class="flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200 cursor-pointer" id="tab-reg" onclick="switchAuthTab('reg')">Daftar Baru</button>
</div>
<!-- Unified Login Form -->
<form class="space-y-4" id="form-login-unified" onsubmit="handleUnifiedLogin(event)">
<div>
<label class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-regular fa-user"></i></span>
<input class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-cyan-500" id="uni-user" placeholder="Masukkan username..." required="" type="text"/>
</div>
</div>
<div>
<label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-regular fa-lock"></i></span>
<input class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 pr-10 text-sm focus:outline-none focus:border-cyan-500" id="uni-pass" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 cursor-pointer" onclick="togglePasswordVisibility('uni-pass', 'eye-icon-login')" type="button">
<i class="fa-regular fa-eye" id="eye-icon-login"></i>
</button>
</div>
</div>
<div class="hidden space-y-1.5 animate-fadeIn" id="container-admin-pin">
<label class="block text-xs font-medium text-amber-400 mb-1.5"><i class="fa-solid fa-key"></i> PIN Khusus Super Admin</label>
<input class="w-full bg-slate-950 border border-amber-500/50 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500" id="uni-pin" placeholder="Masukkan PIN khusus admin..." type="password"/>
</div>
<div class="text-rose-400 text-xs font-semibold text-center hidden" id="admin-lock-warning"></div>
<button class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg cursor-pointer mt-2" id="uni-submit-btn" type="submit">Masuk Website</button>
</form>
<!-- Register Form -->
<form class="space-y-4 hidden" id="form-reg-unified" onsubmit="handleRegister(event)">
<div>
<label class="block text-xs font-medium text-slate-300 mb-1.5">Username Baru</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-regular fa-user-plus"></i></span>
<input class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-cyan-500" id="reg-username" placeholder="Buat username..." required="" type="text"/>
</div>
</div>
<div>
<label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-regular fa-lock"></i></span>
<input class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 pr-10 text-sm focus:outline-none focus:border-cyan-500" id="reg-password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 cursor-pointer" onclick="togglePasswordVisibility('reg-password', 'eye-icon-reg')" type="button">
<i class="fa-regular fa-eye" id="eye-icon-reg"></i>
</button>
</div>
</div>
<button class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg cursor-pointer mt-2" type="submit">Daftar Sekarang</button>
</form>
<div class="text-center text-[11px] text-slate-500 mt-4">Setelah login Anda akan diarahkan ke dashboard.</div></div>
</div><script src="script.js"></script></body></html>
